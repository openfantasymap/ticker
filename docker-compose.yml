# A ticker, and two games that want ticking.
#
#   docker compose up -d
#
# The split to notice: the ticker's ENVIRONMENT says where to publish, and it is
# the only thing here that knows about the broker. Every game's LABELS say what
# its ticks mean. Adding a third game means adding labels to it, not touching
# this service.

services:
  ticker:
    image: ghcr.io/openfantasymap/ticker:latest
    # build: .      # uncomment to build from a checkout instead
    restart: unless-stopped
    environment:
      # WHERE to publish. One broker per deployment.
      MQTT_URL: mqtt://broker.hivemq.com:1883
      # MQTT_USERNAME / MQTT_PASSWORD if the broker wants them.
      TICK_TOPIC_ROOT: ofm/tick
      TICK_LOG: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ticker-state:/var/lib/ofm-ticker
    # Runs as `node`, not root, so it needs the socket's group.
    # Find yours with:  stat -c '%g' /var/run/docker.sock
    group_add:
      - "999"

  # A world in the city builder: an hour of real time is a month of world time.
  toril:
    image: alpine:3
    command: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      ofm.tick.enable: "true"
      ofm.tick.family: cities-world
      ofm.tick.key: toril
      # WHAT a tick is, in real time.
      ofm.tick.interval: 1h
      # What it MEANS, in world time. Months are calendar months.
      ofm.tick.represents: 1 month
      ofm.tick.calendar.start: "2287-01-01"
      ofm.tick.calendar.ticksPerYear: "12"
      # HOW it starts. `epoch` fixes the instant tick `origin` happened, so the
      # world's date is reproducible and survives this service restarting.
      ofm.tick.start: epoch
      ofm.tick.epoch: "2026-01-01T00:00:00Z"
      ofm.tick.origin: "0"
      ofm.tick.label: Toril

  # A different family entirely, at a completely different rate — which is the
  # reason this service is generic rather than a clock for one game.
  combat:
    image: alpine:3
    command: ["sleep", "infinity"]
    restart: unless-stopped
    labels:
      ofm.tick.enable: "true"
      ofm.tick.family: combat-round
      ofm.tick.key: table-9
      ofm.tick.interval: 6s
      ofm.tick.represents: 6 seconds
      # `now` starts the clock the first time this family is seen, and the epoch
      # is then remembered — the one mode that needs the state volume.
      ofm.tick.start: now
      ofm.tick.label: Table 9 initiative

volumes:
  ticker-state:
