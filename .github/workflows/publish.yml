# Build and publish the container image to this repository's own registry.
#
# Images land at ghcr.io/openfantasymap/ticker. `main` publishes :edge, a
# version tag publishes :1.2.3, :1.2, :1 and :latest — so a deployment can
# follow whichever it is comfortable with rather than everyone being pinned to
# the same one.
#
# No secrets to configure: GITHUB_TOKEN can write to the registry belonging to
# the repository that issued it.
name: publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # `write`, not `read`: the last step drafts a GitHub release, and doing
      # that needs write on contents. With `read` the image publishes fine and
      # then the run fails at the very end with a 403 — everything shipped, the
      # build red.
      contents: write
      packages: write
      # Lets the build attach a signed statement of where it came from.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      # Run the tests before publishing. A registry tag is a thing other people
      # deploy; it should not be able to appear from a red commit.
      - name: start a broker
        run: |
          docker run -d --name mosquitto -p 1883:1883 eclipse-mosquitto:2 \
            sh -c 'printf "listener 1883\nallow_anonymous true\n" > /m.conf && mosquitto -c /m.conf'
          for i in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break
            sleep 1
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: test
        run: node test/ticker-check.js --broker mqtt://127.0.0.1:1883

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: sign in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=ofm ticker
            org.opencontainers.image.description=A generic tick service configured by Docker labels
            org.opencontainers.image.licenses=MIT

      - name: build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 included because this is the sort of thing that ends up on a
          # small box next to the game it ticks.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: attest what was built
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
